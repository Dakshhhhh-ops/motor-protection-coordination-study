name: Study

# Runs the test suite, regenerates the whole study from source, and publishes
# the interactive viewer to GitHub Pages. Nothing generated is committed to the
# repository - the published site is always rebuilt from the calculation
# engine, so it cannot drift from the code that produced it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

  build:
    name: Build the study
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # build.sh is the single definition of a build, shared with the Vercel
      # deployment, so the two cannot drift apart. It tolerates main.py exiting
      # 1 (a failing acceptance check is an engineering finding, not a broken
      # build) while still failing on exit 2.
      - name: Build the site
        run: PYTHON=python bash build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
